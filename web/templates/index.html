<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureVision – AI-Powered Deepfake Detection</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --primary-dark: #0099cc;
            --secondary: #6c3ce3;
            --accent: #ff006e;
            --bg-dark: #0f0f23;
            --bg-darker: #070710;
            --surface: #1a1a2e;
            --surface-light: #25274d;
            --text-primary: #ffffff;
            --text-secondary: #b0b0d8;
            --border-color: rgba(0, 212, 255, 0.2);
            --success: #00d97e;
            --warning: #ffa500;
            --error: #ff1744;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 50%, #1a0033 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.05) 0%, transparent 70%);
            pointer-events: none;
            animation: float 20s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        .container {
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 65px rgba(0, 212, 255, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            max-width: 1200px;
            width: 100%;
            padding: 50px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
            position: relative;
            padding-bottom: 30px;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 3.2em;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            animation: fadeInDown 0.8s ease-out;
        }

        .header .subtitle {
            color: var(--text-secondary);
            font-size: 1.15em;
            margin-bottom: 8px;
            font-weight: 500;
            animation: fadeInUp 0.8s ease-out 0.1s both;
        }

        .header .description {
            color: var(--text-secondary);
            font-size: 1em;
            line-height: 1.6;
            animation: fadeInUp 0.8s ease-out 0.2s both;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .upload-box {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            background: rgba(26, 26, 46, 0.4);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .upload-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .upload-box:hover {
            border-color: var(--primary);
            background: rgba(0, 212, 255, 0.05);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.2);
        }

        .upload-box:hover::before {
            opacity: 1;
        }

        .upload-box h3 {
            margin-bottom: 15px;
            font-size: 1.3em;
            color: var(--text-primary);
            font-weight: 600;
        }

        .upload-icon {
            font-size: 2.5em;
            margin-bottom: 15px;
            display: block;
            color: var(--primary);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .file-input {
            display: none;
        }

        .upload-label {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text-primary);
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            display: inline-block;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .upload-label:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.3);
        }

        .file-name {
            margin-top: 12px;
            font-weight: 600;
            color: var(--primary);
            font-size: 0.95em;
        }

        .preview-thumb {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            background: var(--surface);
            flex-shrink: 0;
            border: 2px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .preview-thumb:hover {
            border-color: var(--primary);
        }

        .preview-audio {
            width: 160px;
            flex-shrink: 0;
            filter: invert(1);
        }

        .preview-title {
            font-size: 0.95em;
            color: var(--text-primary);
            font-weight: 600;
            word-break: break-all;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .inline-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-mini {
            padding: 8px 14px;
            font-size: 0.9em;
        }

        button {
            padding: 14px 32px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
            pointer-events: none;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text-primary);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-clear {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        .btn-clear:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            display: none;
            border-top: 2px solid var(--border-color);
            padding-top: 40px;
            animation: slideInUp 0.6s ease-out;
        }

        .results.show {
            display: block;
        }

        @keyframes slideInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results h3 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.3em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .results h3::before {
            content: '';
            width: 4px;
            height: 24px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .result-card {
            background: rgba(37, 39, 77, 0.4);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            gap: 16px;
            align-items: flex-start;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .result-card:hover {
            border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.2);
            transform: translateY(-5px);
        }

        .result-meta {
            font-size: 0.9em;
            color: var(--text-secondary);
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .result-meta::before {
            content: '';
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
        }

        .prediction-pill {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 700;
            margin-top: 10px;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .prediction-real {
            background: rgba(0, 217, 126, 0.2);
            color: var(--success);
            border: 1px solid rgba(0, 217, 126, 0.4);
        }

        .prediction-fake {
            background: rgba(255, 1, 110, 0.2);
            color: var(--accent);
            border: 1px solid rgba(255, 1, 110, 0.4);
        }

        .error-chip {
            background: rgba(255, 23, 68, 0.2);
            color: var(--error);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.85em;
            margin-top: 8px;
            display: inline-block;
            border: 1px solid rgba(255, 23, 68, 0.4);
        }

        .error-message {
            display: none;
            background: rgba(255, 23, 68, 0.15);
            border-left: 4px solid var(--error);
            color: var(--error);
            padding: 16px 20px;
            border-radius: 12px;
            margin-top: 25px;
            animation: slideInUp 0.4s ease-out;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 900px) {
            .container {
                padding: 35px;
            }

            .header h1 {
                font-size: 2.5em;
            }

            .upload-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            .header h1 {
                font-size: 2em;
            }

            .header .subtitle {
                font-size: 1em;
            }

            .upload-box {
                padding: 30px;
            }

            .button-group {
                flex-direction: column;
                gap: 12px;
            }

            button {
                width: 100%;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<div class="container">

    <div class="header">
        <h1><i class="fas fa-shield-alt"></i> SecureVision</h1>
        <p class="subtitle">AI-Powered Multimodal Deepfake Detection</p>
        <p class="description">Advanced machine learning analysis for detecting manipulated audio and visual media with precision and confidence.</p>
    </div>

    <form id="detectionForm">
        <div class="upload-section">

            <div class="upload-box">
                <span class="upload-icon"><i class="fas fa-microphone"></i></span>
                <h3>Audio Analysis</h3>
                <p style="color: var(--text-secondary); font-size: 0.95em; margin-bottom: 15px;">Upload audio files for deepfake detection</p>
                <input type="file" id="audioInput" class="file-input" accept="audio/*" multiple>
                <label class="upload-label" for="audioInput"><i class="fas fa-cloud-upload-alt"></i> Upload Audio</label>
                <div class="file-name" id="audioName"></div>
                <div class="inline-actions">
                    <button type="button" class="btn-clear btn-mini" id="clearAudioBtn"><i class="fas fa-times"></i> Clear</button>
                </div>
            </div>

            <div class="upload-box">
                <span class="upload-icon"><i class="fas fa-image"></i></span>
                <h3>Image Analysis</h3>
                <p style="color: var(--text-secondary); font-size: 0.95em; margin-bottom: 15px;">Upload images for deepfake detection</p>
                <input type="file" id="imageInput" class="file-input" accept="image/*" multiple>
                <label class="upload-label" for="imageInput"><i class="fas fa-cloud-upload-alt"></i> Upload Images</label>
                <div class="file-name" id="imageName"></div>
                <div class="inline-actions">
                    <button type="button" class="btn-clear btn-mini" id="clearImageBtn"><i class="fas fa-times"></i> Clear</button>
                </div>
            </div>

        </div>

        <div class="button-group">
            <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-play"></i> Run Analysis</button>
            <button type="button" class="btn-clear" id="clearBtn"><i class="fas fa-redo"></i> Reset All</button>
        </div>
    </form>

    <div class="error-message" id="errorMsg"></div>
    <div class="results" id="results"></div>

</div>

<script>
    const form = document.getElementById('detectionForm');
    const audioInput = document.getElementById('audioInput');
    const imageInput = document.getElementById('imageInput');
    const submitBtn = document.getElementById('submitBtn');
    const clearBtn = document.getElementById('clearBtn');
    const clearAudioBtn = document.getElementById('clearAudioBtn');
    const clearImageBtn = document.getElementById('clearImageBtn');
    const resultsDiv = document.getElementById('results');
    const errorMsg = document.getElementById('errorMsg');

    let audioFiles = [];
    let imageFiles = [];

    audioInput.onchange = () => {
        audioFiles = Array.from(audioInput.files);
        audioName.textContent = audioFiles.length ? `✓ ${audioFiles.length} audio file(s) selected` : '';
    };

    imageInput.onchange = () => {
        imageFiles = Array.from(imageInput.files);
        imageName.textContent = imageFiles.length ? `✓ ${imageFiles.length} image(s) selected` : '';
    };

    clearBtn.onclick = () => {
        form.reset();
        resultsDiv.classList.remove('show');
        errorMsg.classList.remove('show');
        audioName.textContent = '';
        imageName.textContent = '';
        audioFiles = [];
        imageFiles = [];
    };

    clearAudioBtn.onclick = (e) => {
        e.preventDefault();
        audioInput.value = '';
        audioFiles = [];
        audioName.textContent = '';
    };

    clearImageBtn.onclick = (e) => {
        e.preventDefault();
        imageInput.value = '';
        imageFiles = [];
        imageName.textContent = '';
    };

    form.onsubmit = async (e) => {
        e.preventDefault();
        errorMsg.classList.remove('show');

        if (!audioInput.files.length && !imageInput.files.length) {
            showError("<i class='fas fa-exclamation-circle'></i> Please upload at least one file.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>Analyzing...';

        try {
            const formData = new FormData();
            audioFiles.forEach(file => formData.append('audio', file));
            imageFiles.forEach(file => formData.append('image', file));

            const res = await fetch('/api/detect', { method: 'POST', body: formData });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Analysis failed');

            renderResults(data);
        } catch (err) {
            showError("<i class='fas fa-times-circle'></i> " + err.message);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-play"></i> Run Analysis';
        }
    };

    function showError(msg) {
        errorMsg.innerHTML = msg;
        errorMsg.classList.add('show');
        resultsDiv.classList.remove('show');
    }

    function renderResults(data) {
        resultsDiv.innerHTML = '';

        if (data.error) {
            showError("<i class='fas fa-times-circle'></i> " + data.error);
            return;
        }

        const hasAudio = Array.isArray(data.audio) && data.audio.length;
        const hasImage = Array.isArray(data.image) && data.image.length;

        if (!hasAudio && !hasImage) {
            showError("<i class='fas fa-info-circle'></i> No predictions returned.");
            return;
        }

        if (hasAudio) {
            const audioSection = document.createElement('div');
            audioSection.innerHTML = '<h3><i class="fas fa-microphone-alt"></i> Audio Results</h3>';
            const grid = document.createElement('div');
            grid.className = 'result-grid';
            data.audio.forEach(row => {
                const predictionClass = row.prediction === 'FAKE' ? 'prediction-fake' : 'prediction-real';
                const predictionIcon = row.prediction === 'FAKE' ? 'fa-exclamation-triangle' : 'fa-check-circle';
                const card = document.createElement('div');
                card.className = 'result-card';

                const match = audioFiles.find(f => f.name === row.filename);
                const previewUrl = match ? URL.createObjectURL(match) : null;

                card.innerHTML = `
                    ${previewUrl ? `<audio class="preview-audio" controls src="${previewUrl}"></audio>` : ''}
                    <div style="flex: 1;">
                        <div class="preview-title"><i class="fas fa-volume-up"></i> ${row.filename}</div>
                        ${row.error ? `<div class="error-chip"><i class="fas fa-exclamation"></i> ${row.error}</div>` : `
                            <span class="prediction-pill ${predictionClass}"><i class="fas ${predictionIcon}"></i> ${row.prediction}</span>
                            <div class="result-meta"><strong>${parseFloat(row.confidence).toFixed(2)}%</strong> Confidence</div>
                            <div class="result-meta"><strong>${row.inference_time_ms}</strong> ms Latency</div>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
            audioSection.appendChild(grid);
            resultsDiv.appendChild(audioSection);
        }

        if (hasImage) {
            const imageSection = document.createElement('div');
            imageSection.style.marginTop = '30px';
            imageSection.innerHTML = '<h3><i class="fas fa-image"></i> Image Results</h3>';
            const grid = document.createElement('div');
            grid.className = 'result-grid';
            data.image.forEach(row => {
                const predictionClass = row.prediction === 'FAKE' ? 'prediction-fake' : 'prediction-real';
                const predictionIcon = row.prediction === 'FAKE' ? 'fa-exclamation-triangle' : 'fa-check-circle';
                const card = document.createElement('div');
                card.className = 'result-card';

                const match = imageFiles.find(f => f.name === row.filename);
                const previewUrl = match ? URL.createObjectURL(match) : null;

                card.innerHTML = `
                    ${previewUrl ? `<img class="preview-thumb" src="${previewUrl}" alt="preview" />` : ''}
                    <div style="flex: 1;">
                        <div class="preview-title"><i class="fas fa-photo-video"></i> ${row.filename}</div>
                        ${row.error ? `<div class="error-chip"><i class="fas fa-exclamation"></i> ${row.error}</div>` : `
                            <span class="prediction-pill ${predictionClass}"><i class="fas ${predictionIcon}"></i> ${row.prediction}</span>
                            <div class="result-meta"><strong>${parseFloat(row.confidence).toFixed(2)}%</strong> Confidence</div>
                            <div class="result-meta"><strong>${row.inference_time_ms}</strong> ms Latency</div>
                        `}
                    </div>
                `;
                grid.appendChild(card);
            });
            imageSection.appendChild(grid);
            resultsDiv.appendChild(imageSection);
        }

        errorMsg.classList.remove('show');
        resultsDiv.classList.add('show');
    }
</script>

</body>
</html>
